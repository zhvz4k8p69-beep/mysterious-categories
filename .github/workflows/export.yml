name: Export categories

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:       # "Run workflow" button for an immediate update

permissions:
  contents: write

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python3 export_categories.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet categories.json; then
            git commit -am "Update categories"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 25 * 86400 )) ]; then
            # GitHub turns off scheduled workflows after 60 days without a commit.
            git commit --allow-empty -m "Keep scheduled export active"
            git push
          fi
